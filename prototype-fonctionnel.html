<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <title>FutéRoute — test UI fonctionnel</title>
  <style>html,body{margin:0;min-height:100%;background:#f3f6fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#12213d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#6f7f95}.boot strong{display:block;color:#12213d;font-size:20px;margin-bottom:8px}</style>
</head>
<body>
  <div class="boot"><div><strong>FutéRoute</strong>Chargement de la version de test…</div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./index.html?prototype-functional=20260828',{cache:'no-store'});
      if(!response.ok) throw new Error('HTTP '+response.status);
      let html=await response.text();
      const css='<link rel="stylesheet" href="./prototype-fonctionnel.css?v=20260828b">';
      html=html.replace('</head>',css+'</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="boot"><div><strong>Le prototype ne s’est pas chargé.</strong>Recharge la page. '+String(error&&error.message?error.message:error)+'</div></div>';
    }
  })();
  </script>
</body>
</html>
