name: One-shot remove station yellow separator

on:
  push:
    branches:
      - automation/remove-station-yellow-separator
    paths:
      - .github/workflows/remove-station-yellow-separator.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove empty yellow station separator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    /* Bloc lieu (onglet station) : \"position actuelle\" à gauche, \"France entière\" à droite. */\n    .lieu-controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; }\n    .carburant-row { padding: 15px 0 33px; }'''
          new = '''    /* Bloc lieu (onglet station) : \"position actuelle\" à gauche, \"France entière\" à droite. */\n    .lieu-controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; }\n    /* Dans l'onglet station, le sélecteur carburant est actuellement replié par\n       la règle commune .carburant-row { display:none }. On neutralise donc\n       uniquement son conteneur visuel pour éviter la fine barre jaune vide. */\n    #modeStation .section-carburant { background: transparent; border: 0; padding: 0; margin: 0; }\n    .carburant-row { padding: 15px 0 33px; }'''
          if old not in s:
              raise SystemExit('Expected CSS block not found')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one CSS block, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit the fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Retire le trait jaune sous le bloc Lieu"
          git push
