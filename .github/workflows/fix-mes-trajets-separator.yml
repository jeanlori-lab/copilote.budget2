name: One-shot fix Mes trajets separator

on:
  push:
    branches:
      - automation/fix-mes-trajets-separator
    paths:
      - .github/workflows/fix-mes-trajets-separator.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Mes trajets separator above the row
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.trajet-row:not(.vide) { border-bottom: 1.5px solid #cfd8e0; }'
          new = '.trajet-row:not(.vide) { border-top: 1.5px solid #cfd8e0; }'
          if old not in s:
              raise SystemExit('Expected CSS rule not found')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one CSS rule, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit the fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place le séparateur Mes trajets au-dessus"
          git push
