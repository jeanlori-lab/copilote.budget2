name: Build station ex-aequo test

on:
  push:
    branches:
      - feature/stations-ex-aequo
    paths:
      - .github/workflows/feature-stations-ex-aequo.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test version
        run: python .github/scripts/build-stations-ex-aequo.py
      - name: Basic checks
        run: |
          grep -q "lastStationsMinTrajet" index.html
          grep -q "renderStationsPrixEgaux" index.html
          grep -q "carbChoicesStationResultat" index.html
          grep -q "Stations les moins chères sur le trajet" index.html
      - name: Commit feature test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Teste les stations ex aequo et le carburant après recherche"
          git push
