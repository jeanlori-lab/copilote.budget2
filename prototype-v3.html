<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <title>FutéRoute — Prototype UI v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #f7f9fc;
      --surface: rgba(255,255,255,.96);
      --surface-strong: #ffffff;
      --text: #10213f;
      --muted: #75839a;
      --line: #dce4ef;
      --line-soft: #edf1f6;
      --blue: #1763d6;
      --blue-2: #2d7ce8;
      --navy: #0c2b63;
      --orange: #ff850f;
      --orange-soft: #fff6ea;
      --green: #44a049;
      --red: #dc4c5c;
      --shadow-sm: 0 6px 20px rgba(18, 42, 77, .08);
      --shadow-md: 0 18px 50px rgba(18, 42, 77, .12);
      --radius-lg: 24px;
      --radius-md: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 80% -10%, rgba(45,124,232,.08), transparent 34%),
        linear-gradient(180deg, #fbfcfe 0%, var(--bg) 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(92px + var(--safe-bottom));
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(23,99,214,.22);
      outline-offset: 2px;
    }

    .app {
      width: min(100%, 960px);
      margin: 0 auto;
      position: relative;
    }

    .topbar {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 20px 14px;
      position: relative;
      z-index: 20;
    }

    .brand {
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(31px, 8vw, 44px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
    }
    .brand strong { color: var(--orange); }

    .top-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(201,212,226,.9);
      background: rgba(255,255,255,.92);
      color: var(--navy);
      display: grid;
      place-items: center;
      box-shadow: 0 5px 16px rgba(17,42,78,.08);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn:hover { box-shadow: 0 8px 22px rgba(17,42,78,.12); border-color: #b7c9df; }
    .icon-btn svg { width: 21px; height: 21px; }
    .icon-btn.fuel { color: var(--orange); }

    .map-stage {
      position: relative;
      height: 450px;
      overflow: hidden;
      background: #eef3f1;
      border-top: 1px solid rgba(220,228,239,.7);
      border-bottom: 1px solid rgba(220,228,239,.85);
    }

    #map { width: 100%; height: 100%; z-index: 1; }
    .leaflet-control-attribution { font-size: 8px !important; opacity: .6; }
    .leaflet-control-zoom { display: none; }

    .route-summary {
      position: absolute;
      z-index: 500;
      top: 18px;
      left: 18px;
      right: 18px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      border: 1px solid rgba(213,223,236,.92);
      border-radius: 22px;
      padding: 16px 17px;
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .summary-route { display: grid; gap: 14px; }
    .summary-point { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; position: relative; }
    .summary-point:first-child::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 26px;
      width: 2px;
      height: 28px;
      border-left: 2px dotted #adbbcf;
    }
    .dot {
      width: 23px; height: 23px; border-radius: 50%; background: white; display: grid; place-items: center;
      border: 1px solid currentColor;
      box-shadow: 0 2px 8px rgba(15,36,68,.06);
    }
    .dot::after { content:""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
    .dot.start { color: var(--green); }
    .dot.end { color: var(--red); }
    .summary-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
    .summary-value { font-size: 15px; color: var(--blue); font-weight: 700; }
    .summary-meta { text-align: right; min-width: 98px; }
    .summary-km { font-size: 26px; font-weight: 800; letter-spacing: -.04em; color: var(--text); }
    .summary-time { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
    .summary-time svg { width: 15px; height: 15px; }

    .map-locate {
      position: absolute;
      right: 18px;
      bottom: 28px;
      z-index: 500;
      width: 48px; height: 48px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,.96); color: var(--blue); box-shadow: var(--shadow-sm);
      display: grid; place-items: center; cursor: pointer;
    }
    .map-locate svg { width: 21px; height: 21px; }

    .sheet {
      position: relative;
      z-index: 10;
      margin: -42px 14px 0;
      border-radius: 28px 28px 22px 22px;
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(218,227,238,.88);
      box-shadow: 0 -8px 28px rgba(28,55,91,.06), var(--shadow-sm);
      padding: 10px 16px 18px;
    }
    .grabber { width: 46px; height: 5px; background: #d6dbe3; border-radius: 999px; margin: 1px auto 12px; }

    .sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--navy); text-transform: uppercase; }
    .text-btn {
      border: 0; background: transparent; color: var(--blue); font-weight: 700; font-size: 14px; padding: 9px 4px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .text-btn svg { width: 17px; height: 17px; }

    .route-editor { position: relative; padding-left: 12px; }
    .route-editor::before {
      content:""; position:absolute; left:22px; top:46px; bottom:47px; border-left:2px dotted #cad4e1;
    }
    .field-row { display: grid; grid-template-columns: 36px minmax(0,1fr) 42px; gap: 9px; align-items: center; margin: 8px 0; }
    .field-row .marker { width: 24px; height: 24px; border-radius: 50%; border: 1px solid currentColor; background: #fff; display:grid;place-items:center; z-index:2; }
    .field-row .marker::after { content:""; width:10px;height:10px;border-radius:50%;background:currentColor; }
    .field-row .marker.start { color:var(--green); }
    .field-row .marker.end { color:var(--red); }
    .field-stack label { display:block; font-weight:700; font-size:14px; margin:0 0 7px 4px; }
    .field {
      height: 54px; border-radius: 16px; border: 1.5px solid #d7e0eb; background:#fff;
      display:grid; grid-template-columns: 22px 1fr 25px; gap:9px; align-items:center; padding:0 13px;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .field:focus-within { border-color:#76a7e9; box-shadow:0 0 0 4px rgba(23,99,214,.08); }
    .field svg { width:20px;height:20px;color:#7d8ca3; }
    .field input { border:0;outline:0;width:100%;font-size:15px;font-weight:600;color:var(--text);background:transparent;min-width:0; }
    .field input::placeholder { color:#9ba7b8; font-weight:500; }
    .star { border:0;background:transparent;color:#91a0b5;padding:0;cursor:pointer;display:grid;place-items:center; }
    .star.active { color:var(--orange); }
    .star svg { width:21px;height:21px; }
    .swap {
      width:38px;height:38px;border-radius:12px;border:1px solid #dce4ee;background:#fff;color:var(--navy);
      display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(20,44,78,.06); align-self:end; margin-bottom:8px;
      transition:transform .25s ease;
    }
    .swap:active { transform:rotate(180deg) scale(.94); }
    .swap svg { width:18px;height:18px; }

    .step-row {
      display:grid;grid-template-columns:36px minmax(0,1fr) 42px; gap:9px; align-items:center;
      max-height:0; opacity:0; transform:translateY(-8px); overflow:hidden; transition:max-height .28s ease,opacity .22s ease,transform .28s ease,margin .28s ease;
    }
    .step-row.visible { max-height:92px; opacity:1; transform:none; margin:8px 0; }
    .step-badge { width:24px;height:24px;border-radius:50%;background:#edf4ff;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800;z-index:2; }
    .remove-step { border:0;background:transparent;color:#9a6a72;cursor:pointer;padding:8px; }

    .save-row { display:flex;justify-content:space-between;align-items:center;gap:14px;padding:5px 2px 10px 45px; }
    .save-row .text-btn { font-size:13px; }

    .vehicle-card {
      margin-top: 8px;
      padding: 16px 0 4px;
      border-top: 1px solid var(--line-soft);
    }
    .vehicle-head { display:flex;align-items:center;justify-content:space-between;margin-bottom:12px; }
    .vehicle-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px; }
    .select-card {
      min-width:0; border:1px solid #dce4ef; background:#fff; border-radius:16px; padding:11px 10px;
      display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;
    }
    .select-icon { width:30px;height:30px;border-radius:11px;background:#f2f6fc;display:grid;place-items:center;color:var(--navy); }
    .select-icon.orange { background:var(--orange-soft);color:var(--orange); }
    .select-icon svg { width:17px;height:17px; }
    .select-card label { display:block;font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .select-card select { width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;font-weight:800;padding:3px 0 0;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#77859a 50%),linear-gradient(135deg,#77859a 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 3px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:12px; }

    .optimizer {
      margin: 14px 0 12px;
      border: 1px solid #f0d2a7;
      background: linear-gradient(120deg,#fffaf3,#fff);
      border-radius: 18px;
      padding: 13px 13px 13px 12px;
      display:grid;
      grid-template-columns:38px 1fr auto;
      gap:10px;
      align-items:center;
    }
    .optimizer-icon { width:38px;height:38px;border-radius:14px;background:#fff0da;color:var(--orange);display:grid;place-items:center; }
    .optimizer-icon svg { width:20px;height:20px; }
    .optimizer-title { font-weight:750;font-size:13px;margin-bottom:3px; }
    .optimizer-copy { color:var(--muted);font-size:11px;line-height:1.45; }
    .switch { width:48px;height:28px;border:0;border-radius:999px;background:#dbe2ec;padding:3px;cursor:pointer;transition:background .22s ease;position:relative; }
    .switch::after { content:"";display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(24,44,72,.18);transition:transform .22s ease; }
    .switch.on { background:var(--orange); }
    .switch.on::after { transform:translateX(20px); }

    .cta {
      width:100%;height:58px;border:0;border-radius:18px;color:white;cursor:pointer;
      background:linear-gradient(100deg,#ff7a00 0%,#133a78 36%,#0a2d68 100%);
      box-shadow:0 12px 26px rgba(12,48,109,.21);
      display:flex;align-items:center;justify-content:center;gap:13px;
      font-size:16px;font-weight:800;letter-spacing:-.01em;position:relative;overflow:hidden;
      transition:transform .16s ease,box-shadow .18s ease;
    }
    .cta:active { transform:translateY(1px) scale(.995); box-shadow:0 8px 18px rgba(12,48,109,.17); }
    .cta svg { width:20px;height:20px; }
    .cta .arrow { position:absolute;right:18px; }
    .cta.loading { pointer-events:none; }
    .cta.loading .cta-label { opacity:.62; }
    .spinner { width:19px;height:19px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none; }
    .cta.loading .spinner { display:block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .bottom-nav {
      position:fixed;
      z-index:1000;
      left:0;right:0;bottom:0;
      padding:8px 14px calc(8px + var(--safe-bottom));
      background:rgba(255,255,255,.93);
      border-top:1px solid rgba(217,226,238,.9);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      box-shadow:0 -8px 28px rgba(19,44,77,.05);
    }
    .nav-item { border:0;background:transparent;color:#8997aa;display:grid;place-items:center;gap:4px;font-size:10px;font-weight:650;padding:4px 0;cursor:pointer; }
    .nav-item svg { width:22px;height:22px; }
    .nav-item.active { color:var(--blue); }

    .toast {
      position:fixed;z-index:1200;left:50%;bottom:calc(92px + var(--safe-bottom));transform:translate(-50%,20px);
      background:#0e2345;color:#fff;border-radius:14px;padding:12px 16px;font-size:12px;font-weight:700;box-shadow:var(--shadow-md);
      opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis;
    }
    .toast.show { opacity:1;transform:translate(-50%,0); }

    .desktop-copy { display:none; }

    @media (min-width: 760px) {
      body { padding: 28px; }
      .app { display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:start; }
      .topbar { grid-column:1/-1;padding:0 2px 10px; }
      .map-stage { height:690px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;position:sticky;top:20px; }
      .sheet { margin:0;border-radius:28px;padding:14px 18px 18px;box-shadow:var(--shadow-sm); }
      .route-summary { top:20px;left:20px;right:20px; }
      .bottom-nav { display:none; }
      body { padding-bottom:28px; }
      .desktop-copy { display:block;font-size:12px;color:var(--muted);margin:-2px 0 8px; }
    }

    @media (max-width: 390px) {
      .topbar { padding-inline:14px; }
      .sheet { margin-left:8px;margin-right:8px;padding-inline:12px; }
      .vehicle-grid { gap:6px; }
      .select-card { padding:9px 7px;grid-template-columns:25px minmax(0,1fr);gap:5px; }
      .select-icon { width:25px;height:25px;border-radius:9px; }
      .select-card select { font-size:12px; }
      .optimizer { grid-template-columns:34px 1fr auto;gap:8px;padding:11px 10px; }
      .optimizer-icon { width:34px;height:34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand"><strong>Futé</strong>Route</div>
        <div class="desktop-copy">Prototype visuel — approche “map first”</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn fuel" aria-label="Stations" title="Stations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v15"/><path d="M3 20h13"/><path d="M7 7h5v4H7z"/><path d="M15 7h2l3 3v7a2 2 0 0 1-4 0v-4"/></svg>
        </button>
        <button class="icon-btn" aria-label="Profil" title="Profil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </header>

    <section class="map-stage" aria-label="Aperçu de l’itinéraire">
      <div id="map"></div>
      <div class="route-summary">
        <div class="summary-route">
          <div class="summary-point">
            <span class="dot start"></span>
            <div><div class="summary-label">Départ</div><div class="summary-value" id="summaryStart">Le Mans</div></div>
          </div>
          <div class="summary-point">
            <span class="dot end"></span>
            <div><div class="summary-label">Arrivée</div><div class="summary-value" id="summaryEnd">Paris, France</div></div>
          </div>
        </div>
        <div class="summary-meta">
          <div class="summary-km" id="summaryKm">212 km</div>
          <div class="summary-time">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="summaryTime">2h18</span>
          </div>
        </div>
      </div>
      <button class="map-locate" id="locateBtn" aria-label="Recentrer la carte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </section>

    <section class="sheet">
      <div class="grabber"></div>
      <div class="sheet-heading">
        <div class="eyebrow">Trajet</div>
        <button class="text-btn" id="addStepBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Ajouter une étape
        </button>
      </div>

      <div class="route-editor">
        <div class="field-row">
          <span class="marker start"></span>
          <div class="field-stack">
            <label for="startInput">Départ</label>
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12l14-7-7 14-2-5-5-2z"/></svg>
              <input id="startInput" value="Le Mans" autocomplete="off" />
              <button class="star" aria-label="Ajouter le départ aux favoris">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3z"/></svg>
              </button>
            </div>
          </div>
          <button class="swap" id="swapBtn" aria-label="Inverser départ et arrivée">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m7 7 3-3 3 3M10 4v14M17 17l-3 3-3-3M14 20V6"/></svg>
          </button>
        </div>

        <div class="step-row" id="stepRow">
          <span class="step-badge">1</span>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            <input id="stepInput" placeholder="Étape intermédiaire" autocomplete="off" />
            <span></span>
          </div>
          <button class="remove-step" id="removeStepBtn" aria-label="Supprimer l'étape">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="field-row">
          <span class="marker end"></span>
          <div class="field-stack">
            <label for="endInput">Arrivée</label>
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <input id="endInput" value="Paris, France" autocomplete="off" />
              <button class="star" aria-label="Ajouter l’arrivée aux favoris">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3z"/></svg>
              </button>
            </div>
          </div>
          <span></span>
        </div>
      </div>

      <div class="save-row">
        <button class="text-btn" id="saveRouteBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3z"/></svg>
          Enregistrer
        </button>
        <button class="text-btn" id="resetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Réinitialiser
        </button>
      </div>

      <div class="vehicle-card">
        <div class="vehicle-head">
          <div class="eyebrow">Véhicule</div>
        </div>
        <div class="vehicle-grid">
          <div class="select-card">
            <div class="select-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M4 21h12M8 7h4v4H8zM15 8h2l3 3v6a2 2 0 1 1-4 0v-4"/></svg>
            </div>
            <div><label>Carburant</label><select id="fuelSelect"><option>SP95</option><option>SP98</option><option>E10</option><option>Diesel</option></select></div>
          </div>
          <div class="select-card">
            <div class="select-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 14 4-5"/><path d="M7 17h10"/></svg>
            </div>
            <div><label>Conso</label><select id="consoSelect"><option>6,6 L</option><option>5,5 L</option><option>7,5 L</option><option>9,0 L</option></select></div>
          </div>
          <div class="select-card">
            <div class="select-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M14 15a4.5 4.5 0 0 1 6.5 4"/></svg>
            </div>
            <div><label>À bord</label><select id="peopleSelect"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>6</option></select></div>
          </div>
        </div>

        <div class="optimizer">
          <div class="optimizer-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 4c-8 0-14 4-14 10 0 3 2 5 5 5 6 0 9-7 9-15Z"/><path d="M4 21c2-6 6-10 12-13"/></svg>
          </div>
          <div>
            <div class="optimizer-title">Optimiser mes pleins sur ce trajet</div>
            <div class="optimizer-copy">Trouver la station la moins chère au bon moment sur la route.</div>
          </div>
          <button class="switch" id="optimizerSwitch" role="switch" aria-checked="false" aria-label="Optimiser les pleins"></button>
        </div>
      </div>

      <button class="cta" id="calculateBtn">
        <span class="spinner"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h.01M8 15h2M12 15h2M16 15h.01"/></svg>
        <span class="cta-label">Calculer le coût du trajet</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6.5 8 4l8 3 5-2.5v13L16 20l-8-3-5 2.5v-13Z"/><path d="M8 4v13M16 7v13"/></svg>
      Trajet
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M4 21h12M8 7h4v4H8zM15 8h2l3 3v6a2 2 0 1 1-4 0v-4"/></svg>
      Stations
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3z"/></svg>
      Favoris
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Profil
    </button>
  </nav>

  <div class="toast" id="toast">Prototype</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const toast = $('#toast');
    let toastTimer;
    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    };

    const startInput = $('#startInput');
    const endInput = $('#endInput');
    const summaryStart = $('#summaryStart');
    const summaryEnd = $('#summaryEnd');

    function syncSummary() {
      summaryStart.textContent = startInput.value.trim() || 'Départ';
      summaryEnd.textContent = endInput.value.trim() || 'Arrivée';
    }
    startInput.addEventListener('input', syncSummary);
    endInput.addEventListener('input', syncSummary);

    $$('.star').forEach(btn => btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      showToast(btn.classList.contains('active') ? 'Lieu ajouté aux favoris' : 'Lieu retiré des favoris');
    }));

    const stepRow = $('#stepRow');
    $('#addStepBtn').addEventListener('click', () => {
      stepRow.classList.add('visible');
      setTimeout(() => $('#stepInput').focus(), 180);
    });
    $('#removeStepBtn').addEventListener('click', () => {
      stepRow.classList.remove('visible');
      $('#stepInput').value = '';
    });

    $('#swapBtn').addEventListener('click', () => {
      const a = startInput.value;
      startInput.value = endInput.value;
      endInput.value = a;
      syncSummary();
      if (window.map && window.routeCoords) {
        window.routeCoords.reverse();
        window.routeLine.setLatLngs(window.routeCoords);
        const first = window.routeCoords[0], last = window.routeCoords[window.routeCoords.length - 1];
        window.startMarker.setLatLng(first);
        window.endMarker.setLatLng(last);
      }
      showToast('Départ et arrivée inversés');
    });

    const optimizerSwitch = $('#optimizerSwitch');
    optimizerSwitch.addEventListener('click', () => {
      const on = optimizerSwitch.classList.toggle('on');
      optimizerSwitch.setAttribute('aria-checked', String(on));
      showToast(on ? 'Optimisation des pleins activée' : 'Optimisation désactivée');
    });

    $('#saveRouteBtn').addEventListener('click', () => showToast('Trajet enregistré — démo'));
    $('#resetBtn').addEventListener('click', () => {
      startInput.value = 'Le Mans';
      endInput.value = 'Paris, France';
      $('#stepInput').value = '';
      stepRow.classList.remove('visible');
      optimizerSwitch.classList.remove('on');
      optimizerSwitch.setAttribute('aria-checked', 'false');
      $$('.star').forEach(s => s.classList.remove('active'));
      syncSummary();
      showToast('Paramètres réinitialisés');
    });

    $('#calculateBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.classList.add('loading');
      await new Promise(r => setTimeout(r, 850));
      btn.classList.remove('loading');
      $('#summaryKm').textContent = '212 km';
      $('#summaryTime').textContent = '2h18';
      showToast('Estimation démo : 38,70 € carburant + péages');
    });

    $$('.nav-item').forEach((item, i) => item.addEventListener('click', () => {
      $$('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      if (i !== 0) showToast('Onglet de démonstration');
    }));

    if (window.L) {
      const map = L.map('map', { zoomControl:false, attributionControl:true, dragging:true, tap:true }).setView([48.28, 1.22], 7);
      window.map = map;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      const routeCoords = [
        [48.0061, 0.1996],
        [48.09, 0.48],
        [48.16, 0.78],
        [48.31, 1.10],
        [48.43, 1.43],
        [48.58, 1.73],
        [48.72, 2.04],
        [48.8566, 2.3522]
      ];
      window.routeCoords = routeCoords;
      window.routeLine = L.polyline(routeCoords, { color:'#2568cf', weight:6, opacity:.86, lineCap:'round', lineJoin:'round' }).addTo(map);
      L.polyline(routeCoords, { color:'#ffffff', weight:9, opacity:.42 }).addTo(map).bringToBack();

      const markerHtml = (color) => `<div style="width:30px;height:30px;border-radius:50%;background:white;display:grid;place-items:center;box-shadow:0 5px 14px rgba(18,43,79,.23);border:1px solid ${color}55"><span style="display:block;width:15px;height:15px;border-radius:50%;background:${color};box-shadow:0 0 0 4px ${color}22"></span></div>`;
      window.startMarker = L.marker(routeCoords[0], { icon:L.divIcon({ className:'', html:markerHtml('#44a049'), iconSize:[30,30], iconAnchor:[15,15] }) }).addTo(map);
      window.endMarker = L.marker(routeCoords[routeCoords.length-1], { icon:L.divIcon({ className:'', html:markerHtml('#dc4c5c'), iconSize:[30,30], iconAnchor:[15,15] }) }).addTo(map);
      map.fitBounds(L.latLngBounds(routeCoords).pad(.18));

      $('#locateBtn').addEventListener('click', () => {
        map.fitBounds(L.latLngBounds(routeCoords).pad(.18), { animate:true, duration:.5 });
        showToast('Carte recentrée');
      });
    } else {
      $('#map').style.background = 'linear-gradient(135deg,#e8f0eb,#eef3f7)';
      $('#locateBtn').addEventListener('click', () => showToast('Carte indisponible dans cette démo'));
    }
  </script>
</body>
</html>
