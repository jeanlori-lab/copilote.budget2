  <script>
  (async function(){
    const UI_CSS = String.raw`
/* =========================================================
   FutéRoute — prototype UI fonctionnel
   La logique métier reste celle du index.html de la branche.
   Cette feuille ne change que la présentation.
   ========================================================= */
:root{
  --fr-bg:#f3f6fa;
  --fr-card:#ffffff;
  --fr-text:#12213d;
  --fr-muted:#6f7f95;
  --fr-blue:#2368cf;
  --fr-blue-deep:#174da8;
  --fr-blue-soft:#f2f7fd;
  --fr-orange:#e39a22;
  --fr-orange-soft:#fff9ed;
  --fr-line:#dbe4ef;
  --fr-green:#3d9347;
  --fr-red:#db5961;
  --fr-shadow:0 12px 34px rgba(27,53,87,.075),0 2px 8px rgba(27,53,87,.035);
}

html{background:var(--fr-bg)!important;scrollbar-gutter:stable}
body{
  background:
    radial-gradient(circle at 50% -120px,rgba(70,133,220,.10),transparent 380px),
    var(--fr-bg)!important;
  color:var(--fr-text)!important;
  padding:18px 14px calc(28px + env(safe-area-inset-bottom))!important;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:580px!important}

/* Header : même identité FutéRoute, mais plus compact */
.header{
  text-align:left!important;
  margin:4px 4px 18px!important;
  padding-right:94px;
  min-height:92px;
}
.header h1{
  font-size:46px!important;
  line-height:1!important;
  letter-spacing:-.045em!important;
  transform:none!important;
  margin:0!important;
}
.header h1 .rat-emphasis{color:var(--fr-orange)!important}
.header .tagline{
  padding:0!important;
  margin-top:11px!important;
  font-size:13px!important;
  line-height:1.55!important;
  max-width:480px;
  color:var(--fr-muted)!important;
}
.station-icon-btn,.account-btn{
  width:42px!important;height:42px!important;
  top:2px!important;
  border:1px solid #dce5f1!important;
  background:rgba(255,255,255,.96)!important;
  box-shadow:0 6px 16px rgba(27,53,87,.09)!important;
  font-size:18px!important;
}
.station-icon-btn{right:49px!important;color:#d98710!important}
.account-btn{right:0!important}

/* Cartes */
.card{
  border-radius:22px!important;
  border:1px solid rgba(215,225,237,.82)!important;
  box-shadow:var(--fr-shadow)!important;
  padding:22px!important;
  margin-bottom:16px!important;
}
.card-title{
  color:#8090a7!important;
  font-size:11px!important;
  letter-spacing:.13em!important;
  font-weight:800!important;
  margin-bottom:16px!important;
}

/* Les deux blocs gardent la structure actuelle de FutéRoute */
#paramsCard>.section{
  background:var(--fr-blue-soft)!important;
  border:1px solid #dbe8f6!important;
  border-radius:18px!important;
  padding:14px 16px!important;
  margin-bottom:14px!important;
}
#paramsCard>.section.section-carburant{
  background:var(--fr-orange-soft)!important;
  border-color:#f0ddb3!important;
  padding:14px 16px 15px!important;
}

/* Départ / arrivée */
.add-stop-row{
  margin:0 0 6px!important;
  min-height:30px;
}
.link-btn{
  color:var(--fr-blue)!important;
  font-weight:700!important;
}
.plus-etape{font-size:19px!important;line-height:1}
.points-wrap{margin-top:2px!important}
.point-row{
  padding:8px 0!important;
  gap:10px!important;
}
.point-row .param-label,.point-row label{
  color:#253754!important;
  font-weight:750!important;
}
.point-row input[type="text"],
#points input[type="text"]{
  min-height:48px!important;
  padding:11px 46px 11px 13px!important;
  border-radius:14px!important;
  border:1.5px solid #cfdaea!important;
  background:#fff!important;
  box-shadow:0 1px 0 rgba(17,48,86,.02)!important;
  font-weight:600!important;
}
.point-row input[type="text"]:focus,
#points input[type="text"]:focus{
  border-color:#69a0e5!important;
  box-shadow:0 0 0 4px rgba(35,104,207,.10)!important;
}
.swap-btn{
  border-color:#d4dfed!important;
  background:#fff!important;
  box-shadow:0 4px 12px rgba(27,53,87,.08)!important;
}
.itinerary-controls{
  padding-top:4px;
}
.trajet-save-btn{font-weight:700!important}
.reset-icon{opacity:.85}

/* Favoris et formulaires d'enregistrement */
.saved-chips{gap:7px!important}
.saved-chips>*{border-radius:999px!important}
.save-form input{
  min-height:42px!important;
  border-radius:12px!important;
}
.save-form-btn{border-radius:11px!important}

/* Résumé véhicule : 3 cartes compactes */
.c-pills{
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:9px!important;
  margin:0 0 3px!important;
}
.c-pill{
  min-width:0!important;
  min-height:72px!important;
  padding:11px 10px!important;
  border-radius:15px!important;
  border:1px solid #ead6a9!important;
  background:rgba(255,255,255,.82)!important;
  box-shadow:0 3px 10px rgba(115,78,15,.035)!important;
  text-align:left!important;
}
.c-pill .k{
  display:block!important;
  margin-bottom:6px!important;
  color:#a4874d!important;
  font-size:9.5px!important;
  letter-spacing:.075em!important;
  text-transform:uppercase!important;
  font-weight:800!important;
}
.c-pill .v{
  display:block!important;
  color:#18243a!important;
  font-size:17px!important;
  line-height:1.1!important;
  font-weight:800!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}

/* Réglages véhicule ouverts */
.section-carburant .param-row{
  border-bottom-color:#eadfca!important;
}
.section-carburant .param-label{color:#5d6470!important}
.carb-choices{gap:7px!important}
.carb-choice{
  min-height:38px!important;
  border-radius:12px!important;
  border-width:1px!important;
  background:#fff!important;
}
.carb-choice.active{
  color:#fff!important;
  background:var(--fr-orange)!important;
  border-color:var(--fr-orange)!important;
  box-shadow:0 5px 12px rgba(227,154,34,.18)!important;
}
.conso-arrow,.pax-btn{
  border-radius:11px!important;
}

/* Optimisation plein = option secondaire identifiable */
.reservoir-row{
  margin-top:10px!important;
  padding:12px 0 5px!important;
}
.optim-switch-row{
  gap:10px!important;
  align-items:flex-start!important;
}
.optim-checkbox{
  width:20px!important;height:20px!important;
  border-radius:6px!important;
  margin-top:1px;
}
.optim-checkbox::after{left:5px!important;top:2px!important}
.optim-switch-row.on .optim-checkbox{background:var(--fr-green)!important;border-color:var(--fr-green)!important}
.optim-title{
  font-size:12.5px!important;
  line-height:1.35!important;
  color:#59697c!important;
  font-weight:750!important;
}
.reservoir-hint{
  padding-left:30px!important;
  color:#8a98a9!important;
  font-size:11.5px!important;
  line-height:1.5!important;
}
#vehSaveBtn{margin-top:8px!important}

/* CTA : plus lisible, sans mascotte qui brouille l'action */
.btn-wrap{
  position:sticky!important;
  bottom:0!important;
  z-index:35!important;
  margin:4px -4px 10px!important;
  padding:10px 4px calc(10px + env(safe-area-inset-bottom))!important;
  background:linear-gradient(to bottom,rgba(243,246,250,0),rgba(243,246,250,.94) 26%,rgba(243,246,250,.99) 100%)!important;
}
.btn-car{display:none!important}
.btn{
  min-height:58px!important;
  width:100%!important;
  border-radius:17px!important;
  border:0!important;
  background:linear-gradient(105deg,#438fe8 0%,#2667ce 52%,#1b4da6 100%)!important;
  box-shadow:0 12px 24px rgba(33,93,184,.23)!important;
  font-size:18px!important;
  font-weight:800!important;
  letter-spacing:-.01em!important;
}
.btn:active{transform:translateY(1px) scale(.995)!important}

/* Compte */
.account-card input{
  min-height:44px!important;
  border-radius:12px!important;
}
.account-send,.account-logout{border-radius:12px!important}

/* Résultats : même information, hiérarchie plus nette */
.resultats{margin-top:16px!important}
.ar-toggle{
  background:#f3f6fa!important;
  padding:4px!important;
  border-radius:13px!important;
}
.ar-toggle-btn{border-radius:10px!important}
.route-option,.route-card,.station-card,.res-section{
  border-radius:16px!important;
}
.cost-chip{border-radius:12px!important}
.station-tab-btn{border-radius:11px!important}
.maps-link,.troncon-cta,.nav-icon-btn{border-radius:11px!important}

/* Onglet station seul : rester cohérent avec la page principale */
#modeStation .card,#modeStation.card{border-radius:22px!important}

/* Desktop : on garde le vrai mode 2 colonnes existant, juste un peu plus respirant */
@media (min-width:1040px){
  body{padding-top:26px!important}
  .page.has-results{max-width:1220px!important;column-gap:36px!important}
  .page.has-results #paramsCard{position:sticky;top:22px}
  .page.has-results #calcBtnWrap{position:sticky!important;top:auto!important;bottom:0!important}
}

@media (max-width:600px){
  body{padding:12px 10px calc(20px + env(safe-area-inset-bottom))!important}
  .header{
    margin:4px 5px 15px!important;
    min-height:88px;
    padding-right:88px;
  }
  .header h1{font-size:39px!important}
  .header .tagline{
    font-size:12.5px!important;
    line-height:1.45!important;
    margin-top:9px!important;
  }
  .station-icon-btn,.account-btn{width:39px!important;height:39px!important}
  .station-icon-btn{right:45px!important}
  .card{padding:17px!important;border-radius:20px!important}
  #paramsCard>.section{padding:12px!important;border-radius:16px!important}
  #paramsCard>.section.section-carburant{padding:12px!important}
  .card-title{margin-bottom:12px!important}
  .point-row input[type="text"],#points input[type="text"]{min-height:50px!important;border-radius:13px!important}
  .c-pills{gap:7px!important}
  .c-pill{min-height:66px!important;padding:9px 8px!important;border-radius:13px!important}
  .c-pill .k{font-size:8.5px!important}
  .c-pill .v{font-size:15px!important}
  .reservoir-hint{padding-left:0!important;margin-top:8px!important}
  .btn-wrap{margin-left:-2px!important;margin-right:-2px!important}
  .btn{min-height:56px!important;font-size:17px!important}
}

@media (max-width:390px){
  .header h1{font-size:36px!important}
  .header .tagline{font-size:12px!important}
  .card{padding:15px!important}
  #paramsCard>.section{padding:10px!important}
  .c-pill .v{font-size:14px!important}
}
`;

    const UI_JS = String.raw`
<script>
(function(){
  document.documentElement.dataset.uiPrototype='functional-v2';
  const title=document.querySelector('.card-title');
  if(title && title.textContent.trim().toLowerCase()==='paramètres du trajet') title.textContent='Votre trajet';

  // Le prototype ne remplace aucune fonction : badge purement visuel retiré
  // dès que le document est prêt, pour que le test reste identique à l'app.
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.classList.add('futeroute-ui-test');
  });
})();
<\/script>`;

    try{
      const r = await fetch('./index.html?ui-functional=20260828b',{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      let html = await r.text();
      html = html.replace('</head>', '<style id="futeroute-functional-ui">'+UI_CSS+'</style></head>');
      html = html.replace('</body>', UI_JS+'</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.body.innerHTML='<div class="boot"><div><strong>Impossible de charger FutéRoute</strong>Recharge la page. Détail : '+String(err.message||err)+'</div></div>';
    }
  })();
  </script>
</body>
</html>
